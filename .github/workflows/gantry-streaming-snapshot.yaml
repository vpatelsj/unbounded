name: Gantry ARM64 streaming snapshot
on:
  push:
    branches:
      - build/gantry-arm64-streaming-32e4fd545
permissions:
  contents: read
  packages: write
env:
  SOURCE_SHA: 32e4fd54585355943d5ed75322e7db4ba93cda14
  SNAPSHOT_TAG: v0.8.0-streaming-arm64-32e4fd545
  IMAGE_REGISTRY: ghcr.io/vpatelsj/unbounded-acr-test
jobs:
  images:
    if: github.repository == 'vpatelsj/unbounded'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
        image:
          - name: unbounded-operator
            file: images/unbounded-operator/Containerfile
            target: ""
            net: false
          - name: gantry
            file: images/gantry/Containerfile
            target: ""
            net: false
          - name: gantry-node-config
            file: images/gantry-node-config/Containerfile
            target: ""
            net: false
          - name: machina
            file: images/machina/Containerfile
            target: ""
            net: false
          - name: token-refresher
            file: images/token-refresher/Containerfile
            target: ""
            net: false
          - name: unbounded-net-controller
            file: images/net/Containerfile
            target: controller
            net: true
          - name: unbounded-net-node
            file: images/net/Containerfile
            target: node
            net: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Azure/unbounded
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify source commit
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - if: matrix.image.net
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare network assets
        if: matrix.image.net
        env:
          ARCH: ${{ matrix.platform.arch }}
        run: |
          set -euo pipefail
          npm ci --prefer-offline --no-audit --prefix frontend
          npm run build --prefix frontend
          cp -R frontend/dist/. internal/net/html/dist/
          mkdir -p resources
          curl -fsSL --retry 3 \
            "https://github.com/containernetworking/plugins/releases/download/v1.9.1/cni-plugins-linux-${ARCH}-v1.9.1.tgz" \
            -o "resources/cni-plugins-linux-${ARCH}-v1.9.1.tgz"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.platform.arch }}
          push: true
          provenance: false
          build-args: |
            VERSION=${{ env.SNAPSHOT_TAG }}
            GIT_COMMIT=${{ env.SOURCE_SHA }}
            BUILDARCH=${{ matrix.platform.arch }}
            CNI_PLUGINS_VERSION=v1.9.1
          labels: |
            org.opencontainers.image.source=https://github.com/vpatelsj/unbounded
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=${{ env.SNAPSHOT_TAG }}
          tags: ${{ env.IMAGE_REGISTRY }}/${{ matrix.image.name }}:${{ env.SNAPSHOT_TAG }}-${{ matrix.platform.arch }}
          cache-from: type=gha,scope=streaming-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,scope=streaming-${{ matrix.image.name }}-${{ matrix.platform.arch }},mode=max
  merge:
    needs: images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [unbounded-operator, gantry, gantry-node-config, machina, token-refresher, unbounded-net-controller, unbounded-net-node]
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish architecture index
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          image="$IMAGE_REGISTRY/$IMAGE:$SNAPSHOT_TAG"
          docker buildx imagetools create --tag "$image" "$image-amd64" "$image-arm64"
          docker buildx imagetools inspect "$image" | tee -a "$GITHUB_STEP_SUMMARY"
  plugin:
    if: github.repository == 'vpatelsj/unbounded'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Azure/unbounded
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Render embedded manifests and test integration
        run: |
          make machina-manifests net-manifests unbounded-operator-manifests gantry-manifests \
            VERSION="$SNAPSHOT_TAG" CONTAINER_REGISTRY="$IMAGE_REGISTRY"
          go test ./internal/registryauth ./internal/operator/components/gantry ./internal/gantry/containerdconfig ./cmd/kubectl-unbounded/app
      - name: Build macOS ARM64 installer
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -ldflags "-X github.com/Azure/unbounded/internal/version.Version=$SNAPSHOT_TAG -X github.com/Azure/unbounded/internal/version.GitCommit=$SOURCE_SHA" \
            -o bin/kubectl-unbounded ./cmd/kubectl-unbounded
          mkdir -p build/streaming
          tar -czf build/streaming/kubectl-unbounded-darwin-arm64.tar.gz -C bin kubectl-unbounded
          printf 'source=%s\nversion=%s\nregistry=%s\n' "$SOURCE_SHA" "$SNAPSHOT_TAG" "$IMAGE_REGISTRY" > build/streaming/snapshot.txt
          cd build/streaming
          sha256sum kubectl-unbounded-darwin-arm64.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gantry-arm64-streaming-installer
          path: build/streaming/
          if-no-files-found: error
          retention-days: 30
